title: '[Bug] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, API tokens, or customer data. Discussions are public.
  - type: dropdown
    id: project
    attributes:
      label: Which project does the bug affect?
      options:
        - Storefront Application V3
        - Storefront Application V2 (Nuxt)
        - SDK packages only
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      placeholder: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: reproduction-link
    attributes:
      label: Reproduction link
      description: A link to a repository or a minimal example that shows the bug.
  - type: markdown
    attributes:
      value: |
        ### Version information
  - type: input
    id: sdk-version
    attributes:
      label: SDK package version
      description: 'The `@scayle/storefront` version for V3, or the `@scayle/storefront-nuxt` version for V2.'
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime or framework version
      description: 'The Node.js version for V3, or the `nuxt` version for V2.'
