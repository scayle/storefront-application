title: "[🐞]"
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      value: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "To Reproduce"
      value: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
      value: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Version Information
  - type: input
    id: storefront-nuxt-version
    attributes:
      label: "`@scayle/storefront-nuxt` version"
      description: "Please enter the `@scayle/storefront-nuxt` version you are currently on"
    validations:
      required: true
  - type: input
    id: nuxt-version
    attributes:
      label: "`nuxt` version"
      description: "Please enter the nuxt version which you are currently on"
    validations:
      required: true
