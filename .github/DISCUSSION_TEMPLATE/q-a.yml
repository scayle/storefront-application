title: '[Question] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, API tokens, or customer data. Discussions are public.
  - type: dropdown
    id: project
    attributes:
      label: Which project is this a question for?
      options:
        - Storefront Application V3
        - Storefront Application V2 (Nuxt)
        - SDK packages only
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is your question?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Version information
  - type: input
    id: sdk-version
    attributes:
      label: SDK package version
      description: 'The `@scayle/storefront` version for V3, or the `@scayle/storefront-nuxt` version for V2.'
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime or framework version
      description: 'The Node.js version for V3, or the `nuxt` version for V2.'
