title: ""
labels: []
body:
  - type: dropdown
    id: project
    attributes:
      label: Which project is this a question for?
      options:
        - Storefront Boilerplate
        - Storefront Nuxt (NPM Package)
        - Storefront Core (NPM Package)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What is your question?"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Version Information
  - type: input
    id: storefront-nuxt-version
    attributes:
      label: `@scayle/storefront-nuxt` version
      description: Please enter the `@scayle/storefront-nuxt` version you are currently on
    validations:
      required: true
  - type: input
    id: nuxt-version
    attributes:
      label: `nuxt` version
      description: Please enter the nuxt version which you are currently on
    validations:
      required: true
